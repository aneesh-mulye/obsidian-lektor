# Builds a release when a version tag is pushed (docs/PUBLISHING.md § Repository and release).
# The tag must be exactly the version in manifest.json (x.y.z, no "v"), and CHANGELOG.md must have a
# "## x.y.z" section: that section becomes the release's notes, with GitHub's changelog link after it.
# The release is created as a draft named "Lektor x.y.z", with main.js, manifest.json and styles.css
# attached; publish it by hand after a look.
name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  # Artifact attestations: signed provenance for the release files (the 0.1.1 review's recommendation).
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Check the tag against manifest.json and versions.json
        run: |
          tag="$GITHUB_REF_NAME"
          version="$(node -p "require('./manifest.json').version")"
          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$tag' is not a version like 1.2.3 (no 'v' prefix)."
            exit 1
          fi
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag '$tag' does not match manifest.json version '$version'."
            exit 1
          fi
          node -e "const m = require('./manifest.json'); const v = require('./versions.json'); if (v[m.version] !== m.minAppVersion) { console.error('versions.json must map ' + m.version + ' to ' + m.minAppVersion); process.exit(1); }"

      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v v="## $GITHUB_REF_NAME" '$0 == v { on = 1; next } on && /^## / { exit } on { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no notes under '## $GITHUB_REF_NAME'."
            exit 1
          fi

      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Attest that the plugin files were built here, from this commit
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create a draft release with the plugin files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --draft --title "Lektor $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
